<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What drives vaccine quality at the last mile?">
  <rect width="1200" height="675" fill="#fcfbf9"/>
  <g fill="#e3edf9" stroke="#7ba3d4" stroke-width="2">
    <rect x="80" y="430" width="300" height="110" rx="8"/>
    <rect x="460" y="430" width="240" height="110" rx="8"/>
    <rect x="780" y="430" width="180" height="110" rx="8"/>
  </g>
  <g stroke="#8a97a6" stroke-width="3" fill="none">
    <line x1="380" y1="485" x2="460" y2="485"/>
    <line x1="700" y1="485" x2="780" y2="485"/>
    <line x1="960" y1="485" x2="1040" y2="485"/>
  </g>
  <g fill="#8a97a6">
    <path d="M460 485 L444 477 L444 493 Z"/>
    <path d="M780 485 L764 477 L764 493 Z"/>
    <path d="M1040 485 L1024 477 L1024 493 Z"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#090909">
    <text x="80" y="140" font-size="64">What drives vaccine quality</text>
    <text x="80" y="220" font-size="64">at the last mile?</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="290" font-size="30" fill="#333">WHO EVM assessments | 77 countries | The Quality strand</text>
    <rect x="80" y="320" width="140" height="8" fill="#CA225E"/>
    <g font-size="30" fill="#1f6db4" text-anchor="middle">
      <text x="230" y="475">891</text>
      <text x="230" y="512">requirements</text>
      <text x="580" y="475">170</text>
      <text x="580" y="512">after filtering</text>
      <text x="870" y="475">4 to 5</text>
      <text x="870" y="512">conclusive</text>
    </g>
    <text x="1052" y="495" font-size="34" fill="#CA225E">EVM-Lite</text>
  </g>
</svg>
